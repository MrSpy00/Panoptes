<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="60" height="40">
  <clipPath id="rounded">
    <rect width="60" height="40" rx="4"/>
  </clipPath>
  <g clip-path="url(#rounded)">
    <rect width="60" height="40" fill="#012169"/>
    <!-- White Diagonals -->
    <path d="M0,0 L60,40 M60,0 L0,40" stroke="#FFFFFF" stroke-width="7"/>
    <!-- Red Diagonals -->
    <path d="M0,0 L60,40 M60,0 L0,40" stroke="#C8102E" stroke-width="3.5"/>
    <!-- White Central Cross -->
    <path d="M30,0 L30,40 M0,20 L60,20" stroke="#FFFFFF" stroke-width="11"/>
    <!-- Red Central Cross -->
    <path d="M30,0 L30,40 M0,20 L60,20" stroke="#C8102E" stroke-width="6.5"/>
  </g>
</svg>
