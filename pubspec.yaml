name: panoptes
description: "Panoptes — Mobile-First Offline/Edge OSINT & Biometric Reconnaissance Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  crypto: ^3.0.6
  image: ^4.3.0
  exif: ^3.3.0
  image_picker: ^1.1.2
  flutter_svg: ^2.0.16
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  share_plus: ^10.1.3
  pdf: ^3.11.1
  printing: ^5.13.4
  webview_flutter: ^4.10.0
  google_mlkit_face_detection: ^0.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/panoptes_logo.svg
    - assets/branding/panoptes_icon.svg
    - assets/branding/flag_tr.svg
    - assets/branding/flag_en.svg
