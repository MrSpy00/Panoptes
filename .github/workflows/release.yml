name: Panoptes Release & Security Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies & Analyze
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Obfuscated Release APK & Debug APK
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-release.apk Panoptes-Android-Release.apk
          cp build/app/outputs/flutter-apk/app-debug.apk Panoptes-Android-Debug.apk
          sha256sum Panoptes-Android-Release.apk Panoptes-Android-Debug.apk > SHA256SUMS.txt

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Panoptes-Android-Release.apk
            Panoptes-Android-Debug.apk
            SHA256SUMS.txt
          generate_release_notes: true
